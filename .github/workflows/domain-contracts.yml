name: Pal domain contracts
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [refactor/domain-contracts, refactor/bunshin-ownership]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: df0dcceb716671a3d28a30a58d43a07a60226ff1
          path: .pal-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './.pal-host[test]'
      - run: python -m pip install .
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - run: python -m unittest discover -s tests/pal_host -v
        env:
          PYTHONPATH: ${{ github.workspace }}/.pal-host/src:${{ github.workspace }}/pal_plugin:${{ github.workspace }}/tests/pal_host_support

name: Pal domain contracts
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, refactor/domain-contracts, refactor/bunshin-ownership]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: 9d8cbe906906522e1f4a0d2a50a709385a4209f3
          path: .pal-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './.pal-host[test]'
      - run: python -m pip install .
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - run: python -m pytest -q tests/pal_host
        env:
          PYTHONPATH: ${{ github.workspace }}/.pal-host/src:${{ github.workspace }}/pal_plugin:${{ github.workspace }}/tests/pal_host_support

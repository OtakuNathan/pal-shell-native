name: Pal domain contracts
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, refactor/domain-contracts, refactor/bunshin-ownership]
permissions:
  contents: read
jobs:
  remote-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned TLC
        run: |
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
      - name: Check models, counterexamples and generated runtime reducer
        run: python scripts/check_remote_tla.py "$RUNNER_TEMP/tla2tools.jar" --output-dir "$RUNNER_TEMP/remote-models"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-model-checks
          path: ${{ runner.temp }}/remote-models/*.*
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: 82608c7257c2f701b7edcf41a38c690361f78f6e
          path: .pal-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './.pal-host[test]'
      - run: python -m pip install .
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - name: Verify exported file engine matches the Pal checkout
        run: python .pal-host/scripts/export_file_core.py python/pal_shell_worker/_file_core --check
      - run: python -m pytest -q tests/pal_host
        env:
          PYTHONPATH: ${{ github.workspace }}/.pal-host/src:${{ github.workspace }}/pal_plugin:${{ github.workspace }}/tests/pal_host_support
      - name: Remote reducer conformance and RPC boundaries
        run: python -m pytest -q tests/test_remote_formal.py tests/test_execution_gate.py tests/test_remote_admission.py
        env:
          PYTHONPATH: ${{ github.workspace }}/.pal-host/src:${{ github.workspace }}/pal_plugin

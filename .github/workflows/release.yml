name: build and test extension
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          curl -fsSL --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar' | sha256sum -c -
          scripts/check_session_tla.sh /tmp/tla2tools.jar
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  management-container:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse
      - name: Real sudoers acceptance in a disposable container
        run: |
          docker build -f tests/containers/management.Dockerfile -t pal-management-test .
          docker run --rm pal-management-test
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: 3a75d38ffed0c992f110520647dc857bc3985666
          path: .pal
      - run: python -m pip install . './.pal[test]'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - name: Resident and Bunshin integration against installed extension
        run: python -m unittest discover -s tests/pal_host -v
        env:
          PYTHONPATH: pal_plugin:tests/pal_host_support
      - name: Slot admission and cancellation through multiplexed RPC
        run: python tests/test_remote_admission.py -v
        env:
          PYTHONPATH: pal_plugin
      - name: GIL lifetime regression
        run: |
          cmake -S . -B build/check -DBUILD_TESTING=ON -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/check --parallel 2
          ctest --test-dir build/check --output-on-failure
  worker-bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pyinstaller
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - run: python tests/test_remote.py
      - run: python tests/test_sudo_setup.py
      - run: python tests/test_transport.py
        env:
          PAL_TEST_IDLE_RPC: '1'
      - name: Linux signed management and setup
        if: runner.os == 'Linux'
        run: |
          python tests/test_management.py
          python tests/test_management_setup.py
          python tests/test_management_installer.py
      - run: python packaging/build_worker.py
      - run: dist/pal-shell-worker/pal-shell-worker --help
      - run: python tests/test_worker_bundle.py dist/pal-shell-worker/pal-shell-worker
      - name: Frozen Linux administrator installer handoff
        if: runner.os == 'Linux'
        run: python tests/test_management_bundle.py dist/pal-shell-worker/pal-shell-worker
      - run: tar -czf dist/pal-shell-worker-${{ matrix.os }}.tar.gz -C dist pal-shell-worker
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.os }}
          path: dist/pal-shell-worker-*.tar.gz
          if-no-files-found: error
  remote-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: 3a75d38ffed0c992f110520647dc857bc3985666
          path: .pal
      - run: python -m pip install ./.pal
      - run: pal package build pal_plugin --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: remote-plugin
          path: dist/plugin-remote-*.palpkg
          if-no-files-found: error
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python tests/test_build_tools.py
      - run: python -m build --sdist
      - name: Verify source archive builds without the Git checkout
        run: |
          mkdir source-check
          tar -xzf dist/*.tar.gz -C source-check
          python -m pip install ./source-check/pal_shell_native-*
          python tests/test_backend.py
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [session-model, wheels, integration, source, worker-bundles, remote-plugin, management-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: remote-plugin
          path: dist
      - name: Prepare verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
          cp README.md THIRD_PARTY.md tests/test_backend.py dist/
          cd dist
          sha256sum *.whl *.tar.gz *.palpkg README.md THIRD_PARTY.md test_backend.py > SHA256SUMS
      - name: Publish after all acceptance jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Permit retrying a publication and the explicitly reissued 0.4.0.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi

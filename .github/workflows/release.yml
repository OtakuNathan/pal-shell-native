name: build and test extension
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: da16c294f143d040f3bfc064411c4244156cefeb
          path: .pal
      - run: python -m pip install . './.pal[test]'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - name: Resident and Bunshin integration against installed extension
        run: python -m unittest discover -s .pal/native/shell_runtime/tests -v
        env:
          PYTHONPATH: .pal/native/shell_runtime/python
      - name: GIL lifetime regression
        run: |
          cmake -S . -B build/check -DBUILD_TESTING=ON -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/check --parallel 2
          ctest --test-dir build/check --output-on-failure
  worker-bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pyinstaller
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - run: python tests/test_remote.py
      - run: python tests/test_sudo_setup.py
      - run: python packaging/build_worker.py
      - run: dist/pal-shell-worker/pal-shell-worker --help
      - run: python tests/test_worker_bundle.py dist/pal-shell-worker/pal-shell-worker
      - run: tar -czf dist/pal-shell-worker-${{ matrix.os }}.tar.gz -C dist pal-shell-worker
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.os }}
          path: dist/pal-shell-worker-*.tar.gz
          if-no-files-found: error
  remote-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: da16c294f143d040f3bfc064411c4244156cefeb
          path: .pal
      - run: python -m pip install ./.pal
      - run: pal package build pal_plugin --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: remote-plugin
          path: dist/plugin-remote-*.palpkg
          if-no-files-found: error
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python tests/test_build_tools.py
      - run: python -m build --sdist
      - name: Verify source archive builds without the Git checkout
        run: |
          mkdir source-check
          tar -xzf dist/*.tar.gz -C source-check
          python -m pip install ./source-check/pal_shell_native-*
          python tests/test_backend.py
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, integration, source, worker-bundles, remote-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: remote-plugin
          path: dist
      - name: Prepare verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
          cp README.md THIRD_PARTY.md tests/test_backend.py dist/
          cd dist
          sha256sum *.whl *.tar.gz *.palpkg README.md THIRD_PARTY.md test_backend.py > SHA256SUMS
      - name: Publish after all acceptance jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
